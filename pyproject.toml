[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "om-copilot"
version = "0.0.1"
description = "O&M Copilot for solar plants: inverter fault -> manual instruction -> draft work order, with page citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # pinned tag; change on purpose after own checks (see CLAUDE.md, Decisions)
    "design-ingest[llm] @ git+https://github.com/owl-solar/design-ingest@v0.5.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
om-copilot = "om_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
